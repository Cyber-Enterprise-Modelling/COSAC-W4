<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<title>Dependency Modelling</title>
	<!-- icon -->
	<link rel="icon" href="img/icon.x-icon" type="image/x-icon">
	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<!-- jQueryUI styling -->
	<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
	<!-- Custom styling -->
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<nav class="navbar navbar-light bg-light">
		<div class="container">
			<a class="navbar-brand" href="#"><img id="logo" src="img/CEM-Logo.jpg"></a>
		</div>
	</nav>

	<!-- Bootstrap grid setup -->
	<div style="display: grid; grid-template-columns: 2fr 1fr;" class="container" id="charts-container">
		<div class="container" id="dependency-tree"></div>

		<div class="container" id="right-chart-area">

			<div id="right-chart-params" style="display: grid;">
				<div id="chart-param-box" style="background-color: #fff;">
					<div class="box-left">
						<div class="box-left-label" id="selectedNodeLabel">
							Dynamic Label Here
						</div>
					</div>

					<div class="box-separator"></div>

					<div class="box-right">

						<div class="box-right-top" id="right-chart-selector">
							<div class="btn-group custom-margin" role="group" id="right-chart-selector-buttons">

								<input type="radio" class="btn-check" name="options" id="3point" checked>
								<label class="btn btn-secondary" for="3point">Sensitivity</label>

								<input type="radio" class="btn-check" name="options" id="crit">
								<label class="btn btn-secondary" for="crit">Criticality</label>

								<input type="radio" class="btn-check" name="options" id="caus">
								<label class="btn btn-secondary" for="caus">Causality</label>
							</div>
						</div>

						<div class="box-right-bottom">

							<div class=" form-check form-switch inline-block-buttons" id="sortSwitch">
								<input class="form-check-input" type="checkbox" id="sortSwitchInput">
								<label class="form-check-label" for="sortSwitchInput" data-tooltip="This sorts the chart">Sort</label>
							</div>



							<!-- CRIT-ONLY CHECKBOX -->
							<div class="d-none inline-block-buttons" id="critModeDropdown">
								<select class="form-select form-select-sm w-auto" id="critModeSelect"
									style="font-size: 0.8rem">
									<option value="negative">Negative Criticality</option>
									<option value="positive">Positive Criticality</option>
								</select>
							</div>

							<!-- CAUS-ONLY CHECKBOX -->
							<div class="d-none inline-block-buttons" id="causModeDropdown">
								<select class="form-select form-select-sm w-auto" id="causModeSelect"
									style="font-size: 0.8rem">
									<option value="negative">Negative Causality</option>
									<option value="positive" class="disabled-option" disabled>Positive Causality</option>
								</select>
							</div>
						</div>

					</div>
				</div>
			</div>

			<div id="right-charts"></div>
		</div>
	</div>
	</div>

	<!-- External JS libraries -->
	<script src="https://unpkg.com/d3@7"></script>
	<script src="https://code.jquery.com/jquery-3.5.1.min.js"
		integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
		</script>
	<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"
		integrity="sha256-VazP97ZCwtekAsvgPBSUwPFKdrwD3unUfSGVYrahUqU=" crossorigin="anonymous"></script>
	<!-- Custom JS -->
	<script src="js/tooltips.js"></script>
	<script src="js/main.js"></script>
	<script src="js/dependency-tree.js"></script>
	<script src="js/bar-charts/barchart.js"></script>
	<script src="js/bar-charts/dualBarchart.js"></script>
	
</body>

</html>
